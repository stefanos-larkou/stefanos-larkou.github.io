name: CI

on:
    push:
        branches: [master]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
            - run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
            - run: npm ci
            - run: npm run lint
            - run: npm test
            - run: npm run build
            - run: cp dist/index.html dist/404.html
            - uses: actions/upload-artifact@v7
              with:
                  name: site
                  path: dist
                  retention-days: 1
